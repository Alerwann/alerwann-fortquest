<header>
  <div class="pc">
    <h1 class="jaini-purva-regular">Fortquest</h1>

    <nav >
      <button
        mat-button
        routerLink=""
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Accueil
      </button>
      <button mat-button routerLink="quetes">Quêtes</button>
  
      <button mat-button routerLink="videos" routerLinkActive="active">
        Vidéos supplémentaires
      </button>
  
      <button mat-button routerLink="quizz" routerLinkActive="active">
        Quizz
      </button>
    </nav>
  </div>
 


  <div class="mobile">
    <mat-toolbar>
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-bouton">
        <img src="assets/logomenu.png" alt="logo" />
      </button>
      <h1 class="mobile-title">Fortquest</h1>
    </mat-toolbar>

    <mat-sidenav-container>
      <mat-sidenav
        #sidenav
        mode="side"
        fixedInViewport="true"
        fixedTopGap="120"
      >
        <mat-nav-list>
          <mat-list-item>
            <button
              mat-button
              routerLink=""
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="sidenav.close()"
            >
              Accueil
            </button></mat-list-item
          >
          <mat-list-item>
            <button mat-button routerLink="quetes" (click)="sidenav.close()">
              Quêtes
            </button></mat-list-item
          >
          <mat-list-item>
            <button
              mat-button
              routerLink="videos"
              routerLinkActive="active"
              (click)="sidenav.close()"
            >
              Vidéos supplémentaires
            </button></mat-list-item
          >
          <mat-list-item>
            <button
              mat-button
              routerLink="quizz"
              routerLinkActive="active"
              (click)="sidenav.close()"
            >
              Quizz
            </button></mat-list-item
          >
        </mat-nav-list>
      </mat-sidenav>
    </mat-sidenav-container>
  </div>
</header>
